name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run format:check` is deliberately not wired in here yet — the repo has not been
      # reformatted, so it would fail. review/prettier-format does the one-off reformat and
      # adds this step.

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm test
